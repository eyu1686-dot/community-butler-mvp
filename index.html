<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="邻里小站">
  <meta name="description" content="阳光花园一期小区的生鲜直采与邻里服务演示。">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="./assets/lucide.min.js"></script>
  <script defer src="./app.js"></script>
  <title>邻里小站 · 阳光花园一期</title>
</head>
<body>
  <header class="topbar shell">
    <div class="brand"><img src="./assets/icon-192.png" width="42" height="42" alt=""><div><strong>邻里小站</strong><span>阳光花园一期 · 专属管家站</span></div></div>
    <button class="quality-badge" data-action="quality">本小区品质公约</button>
    <button class="bag" data-action="bag" aria-label="购物袋"><i data-lucide="shopping-bag" aria-hidden="true"></i><span>购物袋</span><b id="bag-count" hidden>0</b></button>
  </header>
  <div id="global-search" class="global-search shell">
    <button data-action="global-search" aria-haspopup="dialog"><i data-lucide="search" aria-hidden="true"></i><span>搜服务/生鲜：如 修空调、找跑腿、保洁、草莓...</span></button>
  </div>
  <main class="shell" id="main"></main>
  <aside id="checkout-bar" class="checkout-bar" hidden aria-label="购物车结算">
    <div><small>已选 0 份</small><strong>¥0.00</strong></div>
    <button class="primary" data-action="bag">去结算</button>
  </aside>
  <nav class="nav" aria-label="主导航">
    <div class="nav-inner">
      <a href="#fresh"><i data-lucide="leaf"></i>生鲜直采</a>
      <a href="#select"><i data-lucide="store"></i>邻里严选</a>
      <a href="#service"><i data-lucide="headset"></i>管家售后</a>
      <a href="#community"><i data-lucide="house"></i>我的小区</a>
    </div>
  </nav>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
